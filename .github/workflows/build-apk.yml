name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize Capacitor and Generate Native Android Files
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ANSAMA Comparador" "com.ansama.comparador" --web-dir=dist
          # Forzamos la creación del entorno Android completo
          npx cap add android || true
          
      - name: Sync and Verify Android Project
        run: |
          npx cap sync android
          # Si la carpeta gradle no existe, forzamos su estructura base
          cd android
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.2
          fi
          chmod +x gradlew

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Comparador-Android
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
