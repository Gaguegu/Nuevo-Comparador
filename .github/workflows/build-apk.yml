name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Esto te permite activar la compilación manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Capacitor for Mobile
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ANSAMA Comparador" "com.ansama.comparador" --web-dir=dist
          npx cap add android

      - name: Copy Web Build to Android Project
        run: npx cap sync android

      - name: Build Android APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: App-Comparador-Android
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7
