<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144e5a"/>
      <stop offset="100%" stop-color="#0a2a32"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Ring with Shadow -->
  <circle cx="256" cy="256" r="236" fill="url(#circleGrad)" stroke="url(#borderGrad)" stroke-width="20" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#22c55e" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Logo Group: Stylized 3D ribbon 'A' -->
  <g transform="translate(0, -10)">
    <!-- Right blue leg & crossbar swoosh -->
    <path d="M 230 110 C 270 110 320 170 350 250 C 370 300 380 340 380 350 C 380 355 370 360 355 355 C 330 345 315 320 290 270 L 210 270 C 190 270 170 290 145 350 C 138 365 125 365 125 355 C 130 330 160 250 200 170 Z" fill="url(#blueGrad)"/>

    <!-- Left red ribbon arch -->
    <path d="M 240 100 C 265 100 280 120 275 145 C 265 185 220 285 190 345 C 180 365 160 375 140 375 C 120 375 120 360 130 340 C 160 270 210 140 240 100 Z" fill="url(#redGrad)"/>

    <!-- Dynamic lightning / energy spark in center -->
    <polygon points="256,180 238,245 264,245 248,310 282,235 258,235" fill="#facc15"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" letter-spacing="5" fill="#b91c1c">ANSAMA</text>
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="3" fill="#144e5a">ENERGÍA</text>
</svg>
